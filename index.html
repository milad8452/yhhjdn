<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>یادآوری مرور</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form id="reminder-form">
        <label for="lesson-name">نام درس:</label><br>
        <input type="text" id="lesson-name" name="lesson-name"><br>

        <label for="reminder-date">تاریخ:</label><br>
        <input type="date" id="reminder-date" name="reminder-date"><br>

        <label for="reminder-time">ساعت:</label><br>
        <input type='time' id='reminder-time' name='reminder-time'><br>

        <!-- دکمه ثبت -->
        <button type='submit'>ثبت یادآوری</button>
    </form>

    <!-- بخش نمایش یادآوری‌ها -->

    <!-- اسکریپت جاوااسکریپت -->
    <script src='app.js'></script>

</html>
